<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- ---- High scores (game over) ---- -->
        <div id="go-records" class="hs-section hidden">
          <form id="new-record-form" class="hs-form hidden" autocomplete="off">
            <p class="hs-new">¡Nuevo récord!</p>
            <div class="hs-form-row">
              <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
              <button type="submit" class="btn">Guardar</button>
            </div>
          </form>
          <span class="label">RÉCORDS</span>
          <table class="hs-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Combo</th></tr>
            </thead>
            <tbody id="go-hs-body"></tbody>
          </table>
          <p class="hs-bests" id="go-bests"></p>
          <button type="button" id="go-reset-btn" class="btn-link">Borrar récords</button>
        </div>
        <!-- ---- /High scores ---- -->
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- ---- High scores (start screen) ---- -->
    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <button type="button" id="play-btn" class="btn">Jugar</button>
        <span class="label">RÉCORDS</span>
        <table class="hs-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Combo</th></tr>
          </thead>
          <tbody id="start-hs-body"></tbody>
        </table>
        <p class="hs-bests" id="start-bests"></p>
        <button type="button" id="start-reset-btn" class="btn-link">Borrar récords</button>
      </div>
    </div>
    <!-- ---- /High scores ---- -->
  </div>

  <script src="game.js"></script>
</body>
</html>
